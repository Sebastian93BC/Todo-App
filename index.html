<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>My Todo List</h1>
        <!-- theme toggle button -->
        <button id="themeToggle" aria-label="Toggle dark/light theme" aria-pressed="false" title="Toggle theme">🌙</button>
        <div class="input-container">
            <input type="text" id="todoInput" placeholder="Enter a new task...">
            <button id="addBtn">Add Task</button>
        </div>
        <div class="filter-container">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="plan">Plan</button>
            <button class="filter-btn" data-filter="todo">To Do</button>
            <button class="filter-btn" data-filter="done">Done</button>
        </div>
        <ul id="todoList"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
