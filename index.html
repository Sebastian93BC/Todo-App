<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-text">
                <h1>My Tasks</h1>
                <p class="task-count" id="taskCount">0 tasks</p>
            </div>
            <!-- theme toggle button -->
            <button id="themeToggle" aria-label="Toggle dark/light theme" aria-pressed="false" title="Toggle theme">🌙</button>
        </div>
        <div class="input-container">
            <input type="text" id="todoInput" placeholder="What needs to be done?">
            <button id="addBtn">
                <span class="btn-icon">+</span>
                <span>Add Task</span>
            </button>
        </div>
        <div class="filter-container">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="plan">Plan</button>
            <button class="filter-btn" data-filter="todo">To Do</button>
            <button class="filter-btn" data-filter="done">Done</button>
        </div>
        <ul id="todoList"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
